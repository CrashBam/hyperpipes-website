<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#2a1a5e"/>
      <stop offset="55%" stop-color="#141240"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a44dff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="neon2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fe0ff"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6fbff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#4de0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4de0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- tunnel rings receding to a vanishing point; each ring is layered
       strokes (wide + faint under narrow + bright) to fake a neon glow -->
  <g fill="none">
    <circle cx="76" cy="50" r="5"  stroke="url(#neon)" stroke-width="4" opacity="0.18"/>
    <circle cx="76" cy="50" r="5"  stroke="url(#neon)" stroke-width="1.4" opacity="0.65"/>

    <circle cx="74" cy="53" r="10" stroke="url(#neon)" stroke-width="5" opacity="0.2"/>
    <circle cx="74" cy="53" r="10" stroke="url(#neon)" stroke-width="1.9" opacity="0.8"/>

    <circle cx="71.5" cy="57.5" r="17.5" stroke="url(#neon)" stroke-width="7" opacity="0.22"/>
    <circle cx="71.5" cy="57.5" r="17.5" stroke="url(#neon)" stroke-width="2.6" opacity="0.9"/>

    <circle cx="68" cy="63.5" r="28" stroke="url(#neon)" stroke-width="9" opacity="0.25"/>
    <circle cx="68" cy="63.5" r="28" stroke="url(#neon)" stroke-width="3.8"/>

    <circle cx="64" cy="71" r="43" stroke="url(#neon2)" stroke-width="13" opacity="0.3"/>
    <circle cx="64" cy="71" r="43" stroke="url(#neon2)" stroke-width="6"/>
  </g>

  <!-- speed streaks whipping past the outer ring -->
  <g stroke-linecap="round" opacity="0.9">
    <line x1="16" y1="34" x2="34" y2="41" stroke="#00f0ff" stroke-width="2.4"/>
    <line x1="10" y1="52" x2="26" y2="55" stroke="#00f0ff" stroke-width="1.6" opacity="0.6"/>
    <line x1="112" y1="30" x2="96" y2="38" stroke="#ff2e88" stroke-width="2.4"/>
    <line x1="119" y1="49" x2="104" y2="53" stroke="#ff2e88" stroke-width="1.6" opacity="0.6"/>
  </g>

  <!-- star sparks -->
  <g fill="#ffffff">
    <circle cx="28" cy="20" r="1.8"/>
    <circle cx="104" cy="16" r="1.3" opacity="0.8"/>
    <circle cx="116" cy="72" r="1.5" opacity="0.9"/>
    <circle cx="14" cy="86" r="1.2" opacity="0.7"/>
    <circle cx="97" cy="104" r="1.6" opacity="0.85"/>
  </g>

  <!-- the craft, dead centre of the tunnel, engine blazing -->
  <ellipse cx="64" cy="94" rx="16" ry="10" fill="url(#flare)"/>
  <polygon points="64,66 50,96 64,88 78,96" fill="url(#ship)"/>
  <polygon points="64,66 60,84 64,88 68,84" fill="#4d7dff" opacity="0.55"/>
  <circle cx="64" cy="92" r="3.4" fill="#eaffff"/>
</svg>
